# Tag it (v*) and the courses are attached to the GitHub Release as
# mg-deathrun-maps-<version>-pack.zip, which website-city's release sync publishes and signs
# as gamemann/mg-deathrun-maps. mg-deathrun names that pack under server_dependencies, so a
# server mounts it beside the game and a player never downloads it.
#
# It signs nothing and publishes nothing itself; see gamespice-platform/ci.
name: Release

on:
    push:
        tags: ['v*']

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python3 tools/build_courses.py --check

    release:
        needs: check
        uses: gamespice-platform/ci/.github/workflows/release.yml@v1.4.3
        permissions:
            contents: write
        with:
            pack: true
            pack-deny: 'tmcdev(?:games)?\.net|x-tmc-dev'
            # Data, with no scripts and no addons: there is no requires.json to compare
            # against a server's addons.
            server-compat: false
